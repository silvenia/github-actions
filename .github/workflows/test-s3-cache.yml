name: Test S3 Cache Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  s3-cache:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s
        volumes:
          - minio-data:/data
        command: server /data
    steps:
      - uses: actions/checkout@v4

      - name: Create cache bucket
        run: |
          curl -sSL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 minioadmin minioadmin
          mc mb --ignore-existing local/cache

      - name: Prepare cache payload
        run: |
          mkdir -p .cache-test
          echo "hello from the s3-cache-action test" > .cache-test/payload.txt

      # The action's save runs in its post step at job completion, so a later
      # step in the same job can never observe it. Each run therefore uses a
      # unique key for the miss path and seeds the hit path directly with mc.
      - name: Restore and save cache (unique key, expect miss)
        id: cache-first
        uses: ./s3-cache-action
        with:
          key: miss-${{ github.run_id }}-${{ runner.os }}
          path: .cache-test
          s3-endpoint: http://minio:9000
          s3-access-key: minioadmin
          s3-secret-key: minioadmin
          s3-bucket: cache

      - name: Verify first pass is a cache miss
        run: |
          if [ "${{ steps.cache-first.outputs.cache-hit }}" = "true" ]; then
            echo "Expected a cache miss on the first pass" >&2
            exit 1
          fi
          echo "Cache miss on first pass, as expected"

      - name: Seed cache archive (same format the action saves)
        run: |
          command -v zstd >/dev/null || sudo apt-get update && sudo apt-get install -y zstd
          tar --use-compress-program 'zstd -T0 --long=30' -cf /tmp/cache-seed.tzst \
            -P -C "${{ github.workspace }}" .cache-test
          mc cp /tmp/cache-seed.tzst local/cache/hit-${{ runner.os }}

      - name: Restore cache (fixed key, expect exact hit)
        id: cache-second
        uses: ./s3-cache-action
        with:
          key: hit-${{ runner.os }}
          path: .cache-test
          s3-endpoint: http://minio:9000
          s3-access-key: minioadmin
          s3-secret-key: minioadmin
          s3-bucket: cache

      - name: Verify second pass is a cache hit and payload is intact
        run: |
          if [ "${{ steps.cache-second.outputs.cache-hit }}" != "true" ]; then
            echo "Expected a cache hit on the second pass" >&2
            exit 1
          fi
          if [ "$(cat .cache-test/payload.txt)" != "hello from the s3-cache-action test" ]; then
            echo "Restored payload does not match" >&2
            exit 1
          fi
          echo "Cache hit on second pass, payload verified"

      - name: Restore with restore-keys fallback (expect prefix match)
        id: cache-fallback
        uses: ./s3-cache-action
        with:
          key: fallback-${{ github.run_id }}
          restore-keys: |
            hit-
          path: .cache-test
          s3-endpoint: http://minio:9000
          s3-access-key: minioadmin
          s3-secret-key: minioadmin
          s3-bucket: cache

      - name: Verify restore-keys fallback matched the seeded key
        run: |
          if [ "${{ steps.cache-fallback.outputs.cache-hit }}" = "true" ]; then
            echo "Expected cache-hit=false for a restore-key match" >&2
            exit 1
          fi
          if [ "${{ steps.cache-fallback.outputs.cache-matched-key }}" != "hit-${{ runner.os }}" ]; then
            echo "Expected matched key 'hit-${{ runner.os }}', got '${{ steps.cache-fallback.outputs.cache-matched-key }}'" >&2
            exit 1
          fi
          echo "restore-keys prefix match verified"
